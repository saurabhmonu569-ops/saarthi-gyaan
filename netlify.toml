# SAARTHI — Netlify deploy configuration
# =====================================================================
# KYUN (2026-08-10):
# Ab tak Netlify ki build settings SIRF dashboard mein thi. Wahi galti
# jo Worker ke saath thi aur jiske liye wrangler.toml banana pada:
#
#   1. Repo dekh kar koi nahi bata sakta ki site kaise banti hai
#   2. Settings badle to kahin likha nahi jaata — koi history nahi
#   3. Naya clone / naya Netlify site banana = sab dobara haath se
#
# Aur ek asli nuksaan bhi tha: cache headers sirf `vercel.json` mein
# likhe the. Wo file Netlify PADHTA HI NAHI. Yaani 165 MB ka knowledge
# data har baar bina cache ke jaa raha tha. Ab wo headers yahan hain.

[build]
  # ⚠️ `npm test &&` 18 AGAST 2026 KO JODA — aur ye is hafte ka sabse
  # zaroori ek-line badlaav hai.
  #
  # Aaj tak yahan sirf `npm run build` tha. Yaani 122 test likhe gaye,
  # roz chalaye gaye, aur unme se EK BHI deploy ke raaste me nahi tha.
  # Koi bhi toota code push kar sakta tha aur Netlify use khushi se build
  # karke live kar deta.
  #
  # Test tabhi kaam ke hain jab wo ROK sakein. Jo test sirf tab chalta hai
  # jab koi use yaad rakh kar chalaye, wo test nahi — sujhav hai.
  #
  # Ab test fail = build fail = deploy nahi.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  # Netlify ka default Node kabhi-kabhi badal jaata hai. Vite 5 ke liye
  # 18+ chahiye; 20 par hi local test hua hai, wahi yahan bhi.
  NODE_VERSION = "20"

# ── CACHE ────────────────────────────────────────────────────────────
# Ye teeno rule vercel.json se aaye hain (wo file Netlify ke liye bekaar
# thi) aur ek naya jodha gaya hai.

# Vite har build mein file ka naam badal deta hai (index-D_M_OaCU.js),
# isliye ise hamesha ke liye cache karna surakshit hai.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Knowledge data (books/, index/) — ab SIRF Search tab ise maangta hai.
# Ask ko iski zaroorat kabhi nahi thi (retrieval Worker par hai), aur Read
# tab 14 Aug se chhupa hua hai. Search kholne wale user ke liye ye ~519 MB
# hai, isliye ek din ka cache aur ek hafte ka stale-while-revalidate.
[[headers]]
  for = "/knowledge/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ⚠️ "/books/*" wala PDF cache-header HATA DIYA — 2026-08-17.
# 23 PDF (586 MB) ab data/books-pdf/ me hain, build me jaati hi nahi.
# Wajah kanooni hai aur poori tarah src/featureFlags.js ke PDF_PAROSO par
# likhi hai. Header rakhne ka matlab hota "ye raasta abhi bhi hai" — hai
# nahi. Anumati milne par PDF wapas public/books/ me aayengi, tab ye
# header bhi wapas aayega:
#     [[headers]]
#       for = "/books/*"
#       [headers.values]
#         Cache-Control = "public, max-age=604800"

# ── SERVICE WORKER ───────────────────────────────────────────────────
# sw.js KABHI cache nahi hona chahiye. Agar browser purani sw.js pakde
# rahe, to naya deploy user tak pahunchta hi nahi — wo purana build hi
# dekhta rehta hai. Aaj hi ye dikkat aayi thi (live site 32,032 chunks
# wala purana build dikha raha tha).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
